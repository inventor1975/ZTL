name: lean

on:
  push:
    paths:
      - "lean/**"
      - "inventory/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # VR's operational numbers (ZSlope): READ from VRCycle at a pinned commit, not copied.
      # Only their import closure (seven VR modules, core Lean, no mathlib) is built.
      - uses: actions/checkout@v4
        with:
          repository: inventor1975/VRCycle
          ref: d40d9c9849ff5b5ed2aaed6ebf02623b46c2945d
          path: lean/vr
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      # The hand-placed `#print axioms` lines. The floor tracks the corpus
      # exactly (158 on 2026-07-21): a threshold set well below the real
      # count would stay green while dozens of prints were deleted.
      - name: zero-axiom ledger
        working-directory: lean
        run: |
          lake build > build.log 2>&1
          # ZTL's own prints only (VR's, under vr/, are VR's ledger); "dirty" counts both
          clean=$(grep -v "vr/VR/" build.log | grep -c "does not depend on any axioms" || true)
          dirty=$(grep -c "depends on axioms" build.log || true)
          echo "zero-axiom checks: $clean; dirty: $dirty"
          test "$dirty" -eq 0
          test "$clean" -ge 2599
      # The hand-placed prints cover 2599 names (2026-11-28: +11, QZ20 (the inequality certificates, Logic1); +6, QZ19Q3 (the instance Q(√3), Logic2); +14, QZ19 (F[√d] for every d, Logic1); +2, Sqrt3 (desc3, no_sqrt3, Logic2); +27, QZ18 (the certificate bridge, Logic1); +2, ZYablo.trunc_exists, trunc_grounded (existence of the truncation model at every n); +202, the QZ quantum-lattice line QZ1–QZ17, QOF, Sqrt2, QZCtx* moved from the private QZ repo by the curator's word; 2026-11-27: +10, ZRankMany (the rank-one corners of _solve_rank_many); +6, ZPlan (the cheapest plan of checks); +3, ZRootFactor; +5, ZMonoTaylor; +8, ZPowTaylor; +5, ZAltSeries; +46, ZExpAdd1–5 + ZLnMul (exp addition law, ln product); +3, ZElim; +14, ZQuad; +12, ZHull; +19, ZInputSubst; +12, ZStipulate; +10, ZDiagnose; +19, ZBackward; +7, Emergence; 2026-11-26: +18, CHSH; +17, Pigeonhole; 2026-11-25: +10, ZChiral; +12, ZCard; +8, ZReplace; +11, ZExt; pure branch 2026-11-22: the Kleene objects removed); the rest are
      # covered transitively, which is an ARGUMENT. This audits every
      # theorem individually, and fails on an orphan module that no
      # target builds.
      - name: per-theorem axiom audit
        run: python3 inventory/axiom_audit.py
