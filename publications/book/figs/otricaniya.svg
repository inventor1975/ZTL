ND: 3, NOR: 3, NXOR: 5, NIMPL: 3. Тот же разрыв жадного и целого, что в девятой главе.</text><text x="60" y="662" font-size="13" fill="#2f6b34" font-weight="600" text-anchor="start">Тонкость про NXOR: правило-к-целому даёт ровно наш ↔ (тождество), а жадное ¬(a⊕b) — нет, мимо на 5 клетках.</text><text x="60" y="688" font-size="13" fill="#555" font-weight="400" text-anchor="start">«Наши» рабочие таблицы — жадные: язык считает по шагам; NAND/NOR/… не отдельные связки, а ¬ поверх наших шести.</text><text x="60" y="710" font-size="12" fill="#999" font-weight="400" text-anchor="start">Считано из ztl.py.</text></svg>