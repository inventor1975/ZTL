"688" width="44" height="44" rx="6" fill="#f2ccc9" stroke="#a6413b" stroke-width="1.5"/><text x="864.0" y="711.0" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="middle" dominant-baseline="central">F</text><line x1="70" y1="736" x2="890" y2="736" stroke="#e3e3e3"/><text x="70" y="760" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start">Почему тело без Z:</text><text x="70" y="782" font-size="14" fill="#444" font-weight="400" text-anchor="start">правило считает жадно — T только если правда вынуждена при любом доигрывании непроверенного, иначе F.</text><text x="70" y="802" font-size="14" fill="#444" font-weight="400" text-anchor="start">Оттого третий знак нигде не выходит из связки — и оттого двойное отрицание Z даёт T, а не Z (см. столбец «не p»).</text><text x="70" y="828" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start">Читать «если»:</text><text x="70" y="850" font-size="14" fill="#444" font-weight="400" text-anchor="start">строка — левый вход a, столбец — правый вход b, клетка = a → b. F → что угодно = T.</text><text x="70" y="870" font-size="14" fill="#444" font-weight="400" text-anchor="start">Таблица несимметрична — потому оси и подписаны.</text></svg>