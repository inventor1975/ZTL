# VR's operational numbers (2026-10-10, the curator's "да"): READ from VRCycle, not copied — `lean/vr` is a
# link to a VRCycle checkout (CI: inventor1975/VRCycle at a pinned commit). Only the numbers' import closure
# (seven VR modules + core Lean, no mathlib) is built.
[[lean_lib]]
name = "VRNumbers"
srcDir = "vr"
roots = ["VR.Numbers.RealsOp"]
globs = ["VR.Arithmetic", "VR.Meta.CSRNorm", "VR.Numbers.Integers", "VR.Numbers.IntegersOp",
         "VR.Numbers.IntegersOrd", "VR.Numbers.RationalsOp", "VR.Numbers.RealsOp"]
leanOptions = {relaxedAutoImplicit = false, maxSynthPendingDepth = 3}

