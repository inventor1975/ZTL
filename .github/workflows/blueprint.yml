name: Build blueprint pages

# PATHS FILTER, added 2026-08-13. The job runs `leanblueprint web`, which
# builds the site out of blueprint/ and reads nothing else; before the filter
# it fired on every push to master and spent a runner rebuilding an unchanged
# site — a dozen times in one working day, none of which touched blueprint/.
#
# The trade-off, stated rather than assumed: a change elsewhere that the
# blueprint QUOTES will no longer trigger a rebuild, so the published site can
# lag the repository. `workflow_dispatch` is kept for exactly that, and it is
# one click. Contrast regression.yml, which deliberately has NO filter,
# because there a missed run means an undetected divergence rather than a
# stale page.

on:
  push:
    branches:
      - master
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y graphviz libgraphviz-dev texlive-base

      - name: Install leanblueprint
        run: pip install leanblueprint

      - name: Build blueprint
        run: leanblueprint web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './blueprint/web'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
