name: lean

on:
  push:
    paths:
      - "lean/**"
      - "inventory/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # VR's operational numbers (ZSlope): READ from VRCycle at a pinned commit, not copied.
      # Only their import closure (seven VR modules, core Lean, no mathlib) is built.
      - uses: actions/checkout@v4
        with:
          repository: inventor1975/VRCycle
          ref: de72f58d6ed8d3cc9d31a40a5f88b27d4cad5414
          path: lean/vr
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      # The hand-placed `#print axioms` lines. The floor tracks the corpus
      # exactly (158 on 2026-07-21): a threshold set well below the real
      # count would stay green while dozens of prints were deleted.
      - name: zero-axiom ledger
        working-directory: lean
        run: |
          lake build > build.log 2>&1
          # ZTL's own prints only (VR's, under vr/, are VR's ledger); "dirty" counts both
          clean=$(grep -v "vr/VR/" build.log | grep -c "does not depend on any axioms" || true)
          dirty=$(grep -c "depends on axioms" build.log || true)
          echo "zero-axiom checks: $clean; dirty: $dirty"
          test "$dirty" -eq 0
          test "$clean" -ge 711
      # The hand-placed prints cover 711 names of 1373 theorems; the rest are
      # covered transitively, which is an ARGUMENT. This audits every
      # theorem individually, and fails on an orphan module that no
      # target builds.
      - name: per-theorem axiom audit
        run: python3 inventory/axiom_audit.py
