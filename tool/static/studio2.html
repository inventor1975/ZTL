<!doctype html>
<meta charset="utf-8">
<title>ZTL Studio</title>
<!--
  One tab. The table is built from /api/formspec, which is the same spec the
  validator enforces and the reference page describes — so a column added in
  tool/zfl2.py appears here without this file being touched. Widgets follow
  from a column's TYPE: choice becomes a dropdown, bool a toggle, everything
  else a field. The front-end decides nothing about the language.
-->
<style>
 :root { --bad:#b3261e; --warn:#8a6d00; --ok:#1a6b2f; --line:#d6d6d6; }
 body { font: 14px/1.45 system-ui, sans-serif; margin: 0; color: #111;
        background: #fafafa; }
 header { display:flex; align-items:center; gap:1em; padding:.7em 1.2em;
          background:#fff; border-bottom:1px solid var(--line); }
 header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
 header .sp { flex:1 }
 header a, header button { font-size:13px; }
 main { padding: 1.2em; max-width: 1320px; margin: 0 auto; }
 /* the grid is wider than the page on a narrow window: it scrolls INSIDE
    this box rather than pushing the whole layout off centre, which is what
    it did before the curator pointed at the screenshot */
 .gridwrap { overflow-x: auto; background:#fff;
             border:1px solid var(--line); }
 table.grid { border-collapse: collapse; width:100%; background:#fff;
              table-layout: fixed; }
 .grid th, .grid td { border:1px solid var(--line); padding:3px 5px;
                      text-align:left; vertical-align:middle; }
 .grid th { background:#f0f0f0; font-weight:600; font-size:12px;
            white-space:normal; }
 .grid th small { display:block; font-weight:400; color:#666;
                  font-size:11px; line-height:1.25; }
 /* a dropdown must show its longest option, or a status reads "провере…" */
 .grid select { min-width: 9.5em; }
 .grid td:last-child, .grid th:last-child { width: 2em; }
 .grid input[type=text], .grid select { width:100%; box-sizing:border-box;
    border:1px solid transparent; background:transparent; padding:3px;
    font:inherit; }
 .grid input[type=text]:focus, .grid select:focus { border-color:#7aa7ff;
    background:#fff; outline:none; }
 .grid td.err input { background:#fde8e6; }
 /* the cell that needs nothing in this mode says so by going quiet */
 .grid input.dim { background:#f6f6f6; }
 .adv { display:none; } body.showadv .adv { display:table-cell; }
 /* Поле уровня документа — та же логика «дополнительно», но это не ячейка
    таблицы, поэтому свой класс и свой display. */
 /* СПЕЦИФИЧНОСТЬ, а не порядок: `.bar { display:flex }` живёт в отдельном
    файле, и одноклассовое правило тут от него зависело — поле показывалось
    ДО включения «дополнительно» (увидел в браузере, не в коде). */
 body:not(.showadv) .advbar { display:none; }
 body.showadv th.adv { display:table-cell; }
 .rowbtn { border:none; background:none; color:#999; cursor:pointer; }
 .bar { margin:.9em 0; display:flex; gap:.6em; align-items:center;
        flex-wrap:wrap; }
 .bar input[type=text] { flex:1; min-width:16em; padding:.45em .6em;
        border:1px solid var(--line); font:inherit; }
 button.primary { background:#111; color:#fff; border:none; padding:.5em 1.1em;
        cursor:pointer; font:inherit; }
 .issues div { padding:.25em 0; }
 .issues .error { color:var(--bad); } .issues .warn { color:var(--warn); }
 .keybox { background:#fff; border:1px solid var(--line); padding:.7em 1em;
   margin:.4em 0; }
 .keybox select, .keybox input { margin:.15em .3em .15em 0; }
 .keybox input { min-width:16em; }
 .keynote { color:#666; font-size:.85em; margin-top:.4em; max-width:52em; }
 #ownai { margin-left:1em; }
 .panel { background:#fff; border:1px solid var(--line); padding:.8em 1em;
          margin:.8em 0; }
 .panel h3 { margin:.1em 0 .5em; font-size:13px; text-transform:uppercase;
             letter-spacing:.06em; color:#555; }
 .panel table { border-collapse:collapse; font-size:13px; }
 .panel td, .panel th { border:1px solid var(--line); padding:2px 6px; }
 .v-EARNED,.v-T { color:var(--ok); font-weight:600; }
 .v-REFUTED,.v-F { color:var(--bad); font-weight:600; }
 .muted { color:#777; }
 .top { background:#fff; border:1px solid var(--line); padding:.7em .9em;
        margin-bottom:1em; }
 .chat { max-height:12em; overflow-y:auto; margin:.5em 0; }
 .msg { padding:.3em 0; } .msg.user { color:#333; }
 .msg.ai { color:#0b3d91; } .msg.sys { color:#777; font-style:italic; }
 .ex { display:flex; gap:.6em; align-items:center; flex-wrap:wrap;
       margin-bottom:.6em; }
 .ex select { padding:.35em .5em; font:inherit; border:1px solid var(--line);
              max-width:22em; }
 .comment { background:#f4f7ff; border-color:#c9d8ff; }

 /* `.bar` was already taken by a layout row in this sheet, and the new one
    silently inherited it — a full-width block instead of a small gauge.
    Named `.aibar` rather than nested deeper: a collision fixed by
    specificity is a collision waiting for the next edit. */
 .comment.pending .wait { color:#777; font-size:.9em; display:flex;
   align-items:center; gap:.6em; margin:0; }
 .aibar { width:8em; height:3px; background:#e3e3e3; overflow:hidden;
   position:relative; flex:0 0 auto; }
 .aibar::after { content:""; position:absolute; top:0; bottom:0; width:35%;
   background:#999; animation: aislide 1.1s ease-in-out infinite; }
 @keyframes aislide { 0%{left:-35%} 100%{left:100%} }
 .comment .dim { color:#777; }
 h1 a { color: inherit; text-decoration: none; }
</style>

<div id="keypanel" hidden></div>
<header>
  <h1><a id="home" href="/">ZTL STUDIO</a></h1>
  <span class="sp"></span>
  <label><input type="checkbox" id="adv"> <span data-t="advanced"></span></label>
  <a id="ref" href="/zfl" target="_blank" data-t="reference"></a>
  <a id="ownai" href="#" data-t="ownai"></a>
  <select id="lang"></select>
</header>

<main>
  <div class="top">
    <div class="ex">
      <label data-t="examples"></label>
      <select id="exkind"></select>
      <select id="exitem"></select>
    </div>
    <div class="chat" id="chat"></div>
    <div class="bar">
      <input type="text" id="ask" data-ph="askph">
      <button class="primary" id="send" data-t="send"></button>
    </div>
  </div>
  <div class="gridwrap"><table class="grid" id="grid"></table></div>
  <div class="bar">
    <button class="rowbtn" id="addrow">+ <span data-t="addrow"></span></button>
  </div>
  <div class="bar advbar" id="groundsbar">
    <label id="groundslabel"></label>
    <input type="text" id="grounds" placeholder="registry_extract, vehicle_title">
  </div>
  <div class="bar">
    <label id="claimlabel"></label>
    <input type="text" id="claim" placeholder="line &lt;= budget">
    <button class="primary" id="run" data-t="run"></button>
  </div>
  <div class="issues" id="issues"></div>
  <div id="report"></div>
</main>

<script src="/static/studio2.js"></script>
